<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile | Clinical System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7fa;
        }

        /* NAVBAR */
        .navbar {
            background: #2c5364;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar h2 {
            font-weight: 500;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: rgba(255,255,255,0.3);
        }

        /* CONTAINER */
        .container {
            padding: 40px 60px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: auto;
        }

        .card h3 {
            margin-bottom: 30px;
            font-weight: 500;
            color: #203a43;
        }

        /* FORM GRID */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px 40px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #2c5364;
            box-shadow: 0 0 5px rgba(44,83,100,0.3);
            outline: none;
        }

        /* BUTTON AREA */
        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .btn-primary {
            background: #2c5364;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #203a43;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
            padding: 10px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* RESPONSIVE */
        @media(max-width: 900px){
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }
        }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>Edit Profile</h2>
        <div>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">

        <div class="card">

            <h3>✏ Update Professional Details</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="form-grid">

                    <div>
                        <label>Role</label>
                        <select name="role">
                            <option value="Doctor" {% if profile.role == "Doctor" %}selected{% endif %}>Doctor</option>
                            <option value="Admin" {% if profile.role == "Admin" %}selected{% endif %}>Admin</option>
                        </select>
                    </div>

                    <div>
                        <label>Hospital Name</label>
                        <input type="text" name="hospital_name" value="{{ profile.hospital_name }}">
                    </div>

                    <div style="grid-column: span 2;">
                        <label>Specialization</label>
                        <input type="text" name="specialization" value="{{ profile.specialization }}">
                    </div>

                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">💾 Save Changes</button>
                    <a href="{% url 'profile' %}" class="btn-secondary">Cancel</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
