<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | Clinical System</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7fa;
        }

        /* NAVBAR */
        .navbar {
            background: #2c5364;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar h2 {
            font-weight: 500;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: rgba(255,255,255,0.3);
        }

        /* CONTAINER */
        .container {
            padding: 40px 60px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 1000px;
            margin: auto;
        }

        .card h3 {
            margin-bottom: 30px;
            font-weight: 500;
            color: #203a43;
        }

        /* PROFILE GRID */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px 40px;
            margin-bottom: 40px;
        }

        .profile-item {
            background: #f4f7fa;
            padding: 15px 18px;
            border-radius: 8px;
            border-left: 4px solid #2c5364;
        }

        .profile-item label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }

        .profile-item p {
            margin: 0;
            font-weight: 500;
            color: #203a43;
            font-size: 15px;
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .btn-primary {
            background: #2c5364;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #203a43;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* RESPONSIVE */
        @media(max-width: 1000px){
            .profile-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 700px){
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>My Profile</h2>
        <div>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">

        <div class="card">

            <h3>👤 User Profile Information</h3>

            <div class="profile-grid">

                <div class="profile-item">
                    <label>Username</label>
                    <p>{{ request.user.username }}</p>
                </div>

                <div class="profile-item">
                    <label>Email</label>
                    <p>{{ request.user.email }}</p>
                </div>

                <div class="profile-item">
                    <label>Role</label>
                    <p>{{ profile.role }}</p>
                </div>

                <div class="profile-item">
                    <label>Hospital</label>
                    <p>{{ profile.hospital_name }}</p>
                </div>

                <div class="profile-item">
                    <label>Specialization</label>
                    <p>{{ profile.specialization }}</p>
                </div>

            </div>

            <div class="button-group">
                <a href="{% url 'edit_profile' %}" class="btn-primary">✏ Edit Profile</a>
                <a href="{% url 'home' %}" class="btn-secondary">⬅ Back to Dashboard</a>
            </div>

        </div>

    </div>

</body>
</html>
