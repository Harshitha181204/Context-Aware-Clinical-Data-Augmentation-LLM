<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clinical AI System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>

    <style>
      :root {
        --primary: #00c6ff;
        --secondary: #0072ff;
        --bg-dark: #0f2027;
        --bg-light: #f4f7fa;
        --card-dark: rgba(255, 255, 255, 0.08);
        --card-light: white;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        transition: 0.4s;
      }

      /* Light Mode */
      body.light {
        background: linear-gradient(135deg, #e0f7ff, #ffffff);
      }

      /* Card */
      .container {
        width: 100%;
        max-width: 420px;
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(20px);
        background: var(--card-dark);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        color: white;
        position: relative;
        transition: 0.4s;
      }

      body.light .container {
        background: var(--card-light);
        color: #333;
      }

      /* Toggle Button */
      .toggle-mode {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 18px;
      }

      /* Lottie */
      #heartbeat {
        width: 120px;
        margin: auto;
      }

      /* Floating Label */
      .input-group {
        position: relative;
        margin-bottom: 25px;
      }

      .input-group input {
        width: 90%;
        padding: 14px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: transparent;
        color: inherit;
        outline: none;
      }

      .input-group label {
        position: absolute;
        top: 14px;
        left: 12px;
        font-size: 14px;
        transition: 0.3s;
        pointer-events: none;
        opacity: 0.7;
      }

      .input-group input:focus + label,
      .input-group input:not(:placeholder-shown) + label {
        top: -8px;
        left: 8px;
        font-size: 11px;
        background: var(--secondary);
        padding: 2px 6px;
        border-radius: 6px;
        color: white;
      }

      /* Button */
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        color: white;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .btn.loading {
        pointer-events: none;
        opacity: 0.8;
      }

      .btn.loading::after {
        content: "";
        width: 18px;
        height: 18px;
        border: 3px solid white;
        border-top: 3px solid transparent;
        border-radius: 50%;
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: translateY(-50%) rotate(360deg);
        }
      }
      
      /* Register */
      .register-text{
          text-align:center;
          margin-top:20px;
          font-size:14px;
      }
      
      .register-text a{
          color:var(--primary);
          text-decoration:none;
          font-weight:500;
      }
      
      /* Error */
      .error-message{
          margin-top:15px;
          padding:12px;
          background:rgba(255,0,0,0.15);
          border:1px solid rgba(255,0,0,0.4);
          border-radius:8px;
          font-size:14px;
      }
      
      /* Footer */
      .footer{
          position:absolute;
          bottom:15px;
          font-size:12px;
          opacity:0.7;
      }
      
      @media(max-width:480px){
          .container{
              margin:20px;
              padding:30px;
          }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="toggle-mode" onclick="toggleMode()">
        <i class="fa-solid fa-moon"></i>
      </div>

      <div id="heartbeat"></div>

      <h2 style="text-align: center">Clinical AI Login</h2>
      <p
        style="
          text-align: center;
          font-size: 13px;
          opacity: 0.7;
          margin-bottom: 25px;
        "
      >
        Secure Access for Doctors & Staff
      </p>

      <form method="POST" onsubmit="startLoading()">
        {% csrf_token %}

        <div class="input-group">
          <input type="text" name="username" placeholder=" " required />
          <label>Username</label>
        </div>

        <div class="input-group">
          <input type="password" name="password" placeholder=" " required />
          <label>Password</label>
        </div>

        <button type="submit" class="btn" id="loginBtn">Login</button>

        <div class="register-text">
          Don't have an account?
          <a href="{% url 'register' %}">Register</a>
        </div>
      </form>

      {% for message in messages %}
      <div class="error-message">{{ message }}</div>
      {% endfor %}
    </div>

    <div class="footer">© 2026 Clinical AI System</div>

    <script>
      lottie.loadAnimation({
        container: document.getElementById("heartbeat"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "https://assets2.lottiefiles.com/packages/lf20_tutvdkg0.json",
      });

      function toggleMode() {
        document.body.classList.toggle("light");
      }

      function startLoading() {
        document.getElementById("loginBtn").classList.add("loading");
      }
    </script>
  </body>
</html>
